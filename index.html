  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { height: 100dvh; overflow: hidden; background: #0a0a0a; font-family: system-ui, -apple-system, sans-serif; color: #e8e8e8; }
    
    /* Глобус и карта */
    #globe { width: 100vw; height: 100dvh; touch-action: none; }
    #city-map-container {
      position: fixed; inset: 0; z-index: 50; background: #0a0a0a;
      opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
    }
    #city-map-container.visible { opacity: 1; pointer-events: auto; }
    #city-map { width: 100%; height: 100%; background: #1a1a1a; }

    /* ========================================= */
    /* ЭКРАН БЛОКИРОВКИ (ПАРОЛЬ)                 */
    /* ========================================= */
    #lock-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: #0a0a0a;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #lock-screen.unlocked {
      opacity: 0; visibility: hidden;
    }
    
    .lock-content {
      display: flex; flex-direction: column;
      align-items: center; gap: 20px;
      width: 100%; max-width: 300px;
      padding: 20px;
    }
    
    .lock-icon {
      font-size: 40px; margin-bottom: 10px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }

    #password-input {
      width: 100%;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 100px;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.3s ease;
    }
    #password-input:focus {
      border-color: rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.08);
    }

    #unlock-btn {
      width: 100%;
      padding: 14px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 100px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    #unlock-btn:active {
      transform: scale(0.96);
      opacity: 0.8;
    }

    .error-msg {
      color: #ff4a4a; font-size: 14px; margin-top: -10px;
      opacity: 0; transition: opacity 0.3s ease;
    }
    .error-msg.visible { opacity: 1; }
    
    /* Тряска при неверном пароле */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .shake { animation: shake 0.3s ease; }

    /* Кнопки поверх карты */
    #back-btn {
      position: fixed; top: calc(20px + env(safe-area-inset-top)); left: 20px; z-index: 1000;
      background: rgba(20, 20, 22, 0.9); border: 1px solid rgba(255, 255, 255, 0.2); color: #e8e8e8;
      padding: 10px 20px; border-radius: 100px; font-size: 14px; backdrop-filter: blur(8px);
      cursor: pointer; display: none;
    }
    #back-btn.visible { display: block; }

    #hint {
      position: fixed; top: calc(24px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      font-size: 13px; color: rgba(255, 255, 255, 0.35); letter-spacing: 0.5px; z-index: 5; pointer-events: none;
      opacity: 1; transition: opacity 1s ease;
    }
    #hint.hidden { opacity: 0; }

    /* ВСПЛЫВАЮЩЕЕ ОБЛАКО */
    .map-popup-bubble {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%) scale(0); transform-origin: bottom center;
      width: 260px; background: #141416; border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1);
      overflow: hidden; opacity: 0;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
      z-index: 1000;
    }
    .map-popup-bubble.active { transform: translateX(-50%) scale(1); opacity: 1; }
    .map-popup-bubble::after {
      content: ''; position: absolute; bottom: -8px; left: 50%;
      transform: translateX(-50%); border-width: 8px 8px 0;
      border-style: solid; border-color: #141416 transparent transparent transparent;
    }
    .bubble-gallery {
      display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
      scrollbar-width: none; -webkit-overflow-scrolling: touch; height: 300px;
    }
    .bubble-gallery::-webkit-scrollbar { display: none; }
    .bubble-item { flex: 0 0 100%; scroll-snap-align: start; display: flex; flex-direction: column; }
    .bubble-item img { width: 100%; height: 190px; object-fit: cover; background: #1a1a1a; }
    .bubble-text {
      padding: 12px; font-size: 13px; line-height: 1.4; color: #d0d0d0;
      text-align: center; display: flex; align-items: center; justify-content: center; flex-grow: 1;
    }
    .bubble-close {
      position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6);
      border: none; color: #fff; width: 24px; height: 24px; border-radius: 50%;
      font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10;
    }

    /* Убираем стандартные стили Leaflet */
    .leaflet-control-attribution { display: none !important; }
    .leaflet-popup-content-wrapper { background: transparent !important; box-shadow: none !important; padding: 0 !important; border-radius: 0 !important; }
    .leaflet-popup-content { margin: 0 !important; width: auto !important; line-height: normal !important; }
    .leaflet-popup-tip-container { display: none !important; }
    .leaflet-popup { margin-bottom: 0 !important; }
  </style>
</head>

    function checkPassword() {
      if (input.value.trim() === SECRET_PASSWORD) {
        lockScreen.classList.add('unlocked');
        localStorage.setItem('site_unlocked', 'true'); // Запоминаем, что пароль введен
      } else {
        errorMsg.classList.add('visible');
        input.parentElement.classList.add('shake');
        setTimeout(() => input.parentElement.classList.remove('shake'), 300);
        input.value = '';
      }
    }

    unlockBtn.addEventListener('click', checkPassword);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkPassword();
    });
    input.addEventListener('input', () => {

    const cityMapContainer = document.getElementById('city-map-container');
    const backBtn = document.getElementById('back-btn');
    const hint = document.getElementById('hint');
    let cityMap = null;
    let isFlying = false;
    let activePopup = null;

    // ==== ГЛОБУС ====
    const globe = new CoreGlobe.Globe({
      container: document.getElementById('globe'),
      dataBaseUrl: 'https://cdn.jsdelivr.net/npm/core-globe/dist/data/',
      config: { autoRotate: true },
      onMarkerClick: (id) => {
        const city = CITIES.find(c => c.id === id);
        if (city) goToCity(city);
      }
    });

    CITIES.forEach(c => globe.addMarker({ id: c.id, lat: c.lat, lng: c.lng, style: 'current' }));

    async function goToCity(city) {
      if (isFlying) return;
      isFlying = true;
      
      globe.setAutoRotate(false);
      hint.classList.add('hidden');

      await globe.animateFlight({ lat: city.lat, lng: city.lng });
      
      let frames = 0;
      const fixCamera = () => {
        if (frames < 10) {
          if (globe.camera) { globe.camera.position.z = 3.8; globe.camera.updateProjectionMatrix(); }
          frames++;
          requestAnimationFrame(fixCamera);
        }
      };
      requestAnimationFrame(fixCamera);

      showCityMap(city.id);
      isFlying = false;
    }

    function showCityMap(cityId) {
      if (cityMap) {
        cityMap.remove();
        cityMap = null;
        activePopup = null;
      }

      cityMapContainer.classList.add('visible');
      backBtn.classList.add('visible');

      const places = CITY_PLACES[cityId] || [];
      const center = places.length > 0 ? [places[0].lat, places[0].lng] : [55.7558, 37.6173];

      cityMap = L.map('city-map', { zoomControl: false, attributionControl: false }).setView(center, 14);

      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 16
      }).addTo(cityMap);

      cityMap.on('click', () => {
        window.closeActivePopup();
      });

      const customIcon = L.divIcon({
        className: 'custom-marker',
        html: `<div style="width:14px; height:14px; background:#fff; border-radius:50%; border:2px solid #0a0a0a; box-shadow:0 0 10px rgba(255,255,255,0.6);"></div>`,
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });

      places.forEach(place => {
        const marker = L.marker([place.lat, place.lng], { icon: customIcon }).addTo(cityMap);
        
        marker.on('click', (e) => {
          L.DomEvent.stopPropagation(e); 
          
          if (activePopup) {
            activePopup.classList.remove('active');
            const oldPopup = activePopup;
            setTimeout(() => { if(oldPopup) oldPopup.remove(); }, 300);
          }

          let galleryHtml = '';
          place.gallery.forEach(item => {
            galleryHtml += `
              <div class="bubble-item">
                <img src="${item.img}" loading="lazy">
                <div class="bubble-text">${item.text}</div>
              </div>
            `;
          });

          const popupContent = `
            <button class="bubble-close" onclick="closeActivePopup()">✕</button>
            <div class="bubble-gallery">${galleryHtml}</div>
          `;

          const popup = L.popup({
            className: 'transparent-popup',
            closeButton: false,
            offset: [0, -10],
            autoPan: true,
            minWidth: 260,
            maxWidth: 260
          })
          .setLatLng([place.lat, place.lng])
          .setContent(`<div class="map-popup-bubble">${popupContent}</div>`)
          .openOn(cityMap);

          setTimeout(() => {
            const popupElement = document.querySelector('.map-popup-bubble');
            if (popupElement) {
              popupElement.classList.add('active');
              activePopup = popupElement;
              
              if (cityMap) {
                cityMap.invalidateSize();
              }
            }
          }, 10);
        });
      });

      if (places.length > 1) {
        const bounds = L.latLngBounds(places.map(p => [p.lat, p.lng]));
        cityMap.fitBounds(bounds, { padding: [80, 80] });
      }
    }

    window.closeActivePopup = function() {
      if (activePopup) {
        activePopup.classList.remove('active');
        const oldPopup = activePopup;
        setTimeout(() => { if(oldPopup) oldPopup.remove(); }, 300);
        activePopup = null;
      }
    };

    backBtn.addEventListener('click', () => {
      window.closeActivePopup();
      cityMapContainer.classList.remove('visible');
      backBtn.classList.remove('visible');
      
      if (globe.camera) {
        const startZ = globe.camera.position.z;
        const targetZ = 8.0;
        const duration = 500;
        const startTime = performance.now();
        
        function animateOut(now) {
          const progress = Math.min((now - startTime) / duration, 1);
          globe.camera.position.z = startZ + (targetZ - startZ) * progress;
          if (progress < 1) requestAnimationFrame(animateOut);
        }
        requestAnimationFrame(animateOut);
      }
      
      setTimeout(() => {
        globe.setAutoRotate(true);
        hint.classList.remove('hidden');
      }, 500);
    });
  </script>
